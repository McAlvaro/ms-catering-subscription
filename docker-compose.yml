# =============================================================================
# Uso:
#   1. cp .env.example .env        # crear archivo de variables de entorno
# =============================================================================

name: ms-catering-subscription
services:
  db:
    image: mysql:8.4
    container_name: ms-catering-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_HOST_PORT:-3325}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - catering-net

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: ${APP_IMAGE:-alv641/ms-catering-subscription:1.0.0}
    container_name: ms-catering-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      # Sobreescribe el datasource del application.yml.
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://db:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true
        &useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${APP_HOST_PORT:-8080}:8080"

    networks:
      - catering-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  mysql_data:
    driver: local

networks:
  catering-net:
    driver: bridge
