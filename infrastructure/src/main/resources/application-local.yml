server:
  port: 8081

spring:
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
        register: false
        register-health-check: false
      service-registry:
        enabled: false
        auto-registration:
          enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

management:
  health:
    consul:
      enabled: false

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
