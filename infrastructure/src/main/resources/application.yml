server:
  port: 8080

spring:
  application:
    name: ms-catering-subscription

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 5000

  # ── MySQL ──────────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://127.0.0.1:3325/ms_catering_subscription?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: admin_db
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA / Hibernate ────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none # Liquibase controla el esquema, Hibernate no modifica nada
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Liquibase ──────────────────────────────────────────────────────
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${spring.application.instance-id:${HOSTNAME:${random.value}}}
        register-health-check: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        prefer-ip-address: ${CONSUL_PREFER_IP_ADDRESS:false}
        fail-fast: true
    service-registry:
      auto-registration:
        enabled: true

# ── Swagger / SpringDoc ──────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: false
  paths-to-match:
    - /api/subscriptions
    - /api/subscriptions/**
    - /api/consolidated-calendars
    - /api/consolidated-calendars/close
  paths-to-exclude:
    - /api/patients
    - /actuator/**
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never # "always" útil en dev, "never" seguro en prod

app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topic: bc3.catering.eventos

outbox:
  provider: ${OUTBOX_PROVIDER:kafka}
  relay-enabled: "${OUTBOX_RELAY_ENABLED:${KAFKA_ENABLED:false}}"
  poll-interval: 5s
  batch-size: 20
  lease-duration: 1m
  initial-backoff: 5s
  max-backoff: 5m
