databaseChangeLog:
  - changeSet:
      id: 1.0-create-consolidated-lines
      author: alvaro
      changes:
        - createTable:
            tableName: consolidated_lines
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: calendar_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: subscription_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: diet_plan_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: service_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: address_street
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: address_number
                  type: varchar(50)
              - column:
                  name: address_city
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: address_reference
                  type: varchar(255)
              - column:
                  name: address_latitude
                  type: double
              - column:
                  name: address_longitude
                  type: double
              - column:
                  name: address_phone
                  type: varchar(50)
              - column:
                  name: time_start
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: time_end
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: instructions
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: consolidated_lines
            baseColumnNames: calendar_id
            referencedTableName: consolidated_calendars
            referencedColumnNames: id
            constraintName: fk_cons_line_calendar
            onDelete: CASCADE
  - changeSet:
      id: 1.1-add-closed-delivery-snapshots
      author: alvaro
      changes:
        - addColumn:
            tableName: consolidated_lines
            columns:
              - column: { name: patient_name, type: varchar(255) }
              - column: { name: plan_day_number, type: int, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: address_id, type: varchar(64) }
              - column: { name: address_alias, type: varchar(255) }
        - createTable:
            tableName: consolidated_line_recipes
            columns:
              - column: { name: id, type: varchar(64), constraints: { primaryKey: true, nullable: false } }
              - column: { name: line_id, type: varchar(64), constraints: { nullable: false } }
              - column: { name: recipe_id, type: varchar(64), constraints: { nullable: false } }
              - column: { name: recipe_name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: meal_time, type: varchar(5), constraints: { nullable: false } }
              - column: { name: portion_grams, type: int, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: consolidated_line_recipes
            baseColumnNames: line_id
            referencedTableName: consolidated_lines
            referencedColumnNames: id
            constraintName: fk_consolidated_line_recipe
            onDelete: CASCADE
