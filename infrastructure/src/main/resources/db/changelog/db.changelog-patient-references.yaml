databaseChangeLog:
  - changeSet:
      id: 1.0-create-patient-references
      author: alvaro
      changes:
        - createTable:
            tableName: patient_references
            columns:
              - column:
                  name: patient_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: false
  - changeSet:
      id: 1.1-add-patient-name-for-operational-snapshots
      author: alvaro
      changes:
        - addColumn:
            tableName: patient_references
            columns:
              - column: { name: patient_name, type: varchar(255) }
